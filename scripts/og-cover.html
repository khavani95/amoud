<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  .canvas { position:relative; width:1200px; height:630px; overflow:hidden;
    font-family:'Vazirmatn',sans-serif; background:#0a0a0c; color:#f6f4ee; }
  .glow { position:absolute; width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle, rgba(201,162,75,.20) 0%, transparent 62%);
    top:-300px; left:-220px; }
  .glow2 { position:absolute; width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle, rgba(201,162,75,.10) 0%, transparent 65%);
    bottom:-240px; right:-140px; }
  .grid { position:absolute; inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);
    background-size:46px 46px; }
  .wrap { position:relative; height:100%; padding:74px 84px;
    display:flex; flex-direction:column; justify-content:space-between; }
  .top { display:flex; align-items:center; gap:22px; }
  .top img { height:96px; filter:brightness(0) invert(1); }
  .name { font-size:30px; font-weight:900; line-height:1.5; }
  .en { font-size:15px; color:#8c887f; letter-spacing:1.5px; }
  .rule { width:78px; height:5px;
    background:linear-gradient(90deg,#dab863,#a07d2c); margin-bottom:26px; }
  h1 { font-size:60px; font-weight:900; line-height:1.42; }
  .gold { background:linear-gradient(135deg,#dab863,#a07d2c);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .bottom { display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.12); padding-top:26px; font-size:22px; }
  .muted { color:#8c887f; }
  .g { color:#c9a24b; font-weight:700; }
</style></head><body><div class="canvas">
<div class="glow"></div><div class="glow2"></div><div class="grid"></div>
<div class="wrap">
  <div class="top">
    <img src="../public/brand/logo.png">
    <div><div class="name">شرکت آمود گستر آتیه</div>
      <div class="en">AMOUD GOSTAR ATIEH Co.</div></div>
  </div>
  <div>
    <div class="rule"></div>
    <h1>پیمانکاری ساختمان و اجرای<br><span class="gold">تاسیسات الکتریکال و مکانیکال</span></h1>
  </div>
  <div class="bottom">
    <span class="muted">مشارکت در ساخت · ساختمان‌سازی · موتورخانه · از سال ۱۳۸۰</span>
    <span class="g">Amoud-co.ir</span>
  </div>
</div></div></body></html>
